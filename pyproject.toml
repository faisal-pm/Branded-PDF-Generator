[project]
name = "brandpdf"
version = "0.1.0.dev0"
description = "Turn a brand kit and Markdown into consistently branded, multi-page PDFs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Md Faisal Ahamed" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "reportlab>=4.1",
    "typer>=0.12",
]

[project.scripts]
brandpdf = "brandpdf.cli:app"

[dependency-groups]
dev = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
