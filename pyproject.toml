[project]
name = "brandpdf"
version = "1.0.0"
description = "Turn a brand kit and Markdown into consistently branded, multi-page PDFs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Md Faisal Ahamed" }]
requires-python = ">=3.10"
keywords = ["pdf", "markdown", "branding", "letterhead", "reportlab", "documents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "reportlab>=4.1",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/faisal-pm/Branded-PDF-Generator"
Documentation = "https://github.com/faisal-pm/Branded-PDF-Generator/tree/main/docs"
Issues = "https://github.com/faisal-pm/Branded-PDF-Generator/issues"
Changelog = "https://github.com/faisal-pm/Branded-PDF-Generator/blob/main/CHANGELOG.md"

[project.scripts]
brandpdf = "brandpdf.cli:app"

[dependency-groups]
dev = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/CLAUDE.md", "/.python-version"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "error::DeprecationWarning:brandpdf.*",
    "error::DeprecationWarning:pypdf.*",
    # PyMuPDF (test-only) imports SWIG types without __module__ on Python 3.12+
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
